<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<title>Bānu Bestellterminal</title>
<!-- Bānu Bestellterminal (Prototyp, Step 22). Hochkant 1080 x 1920, Touch.
     kiosk.html          Kundenterminal      (auch kiosk.html#kiosk)
     kiosk.html#kds      Küchenmonitor, Bon je Station Smoothie, Toast, Kaffee (1920 x 1080)
     kiosk.html#ready    Abholmonitor mit Pickup Würfel (1920 x 1080)
     Oben rechts schaltet eine kleine Leiste zwischen den Ansichten um (?bar=0 blendet sie aus).
     Bestellungen laufen über localStorage und BroadcastChannel zwischen Tabs im selben Browser (Demo). Bezahlung ist nur simuliert.
     Schriften und Bilder relativ aus assets/, Logo inline. Optional daneben: Banu_Kiosk_Attract.mp4.
     Bānu, Konzept von Social Bites für den Inhaber, Entwurf. Marke noch nicht angemeldet. Bilder sind KI Visualisierungen. -->
<style>
@font-face{font-family:'Archivo';src:url('assets/fonts/Archivo-VF.ttf');font-weight:100 900;font-stretch:62% 125%}
@font-face{font-family:'DM Sans';src:url('assets/fonts/DMSans-VF.ttf');font-weight:100 1000}
@font-face{font-family:'JB Mono';src:url('assets/fonts/JetBrainsMono-VF.ttf');font-weight:100 800}
:root{--basalt:#1A1C1A;--moos:#26342A;--beton:#8C877E;--creme:#EAE4D7;--eis:#BCD4D4;--l:rgba(234,228,215,.16);--l2:rgba(234,228,215,.32);--dim:rgba(234,228,215,.64)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#111311;overflow:hidden;font-family:'DM Sans',sans-serif;color:var(--creme);user-select:none;-webkit-user-select:none}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:disabled{cursor:default}
.disp,.nm,h1,h2,h3{font-family:'Archivo',sans-serif;font-stretch:125%;font-weight:800;letter-spacing:-.02em}
.mono{font-family:'JB Mono',monospace;text-transform:uppercase;letter-spacing:.09em;font-weight:500}
#bar{position:fixed;right:10px;top:6px;z-index:1000;display:flex;gap:6px}
#bar a{font:600 13px 'DM Sans',sans-serif;color:var(--creme);border:1px solid rgba(234,228,215,.4);background:#1A1C1A;border-radius:9px;padding:6px 14px;text-decoration:none}#bar a.on{background:var(--creme);color:#1A1C1A}
#stage{position:absolute;left:0;top:0;transform-origin:0 0;overflow:hidden;background:var(--basalt)}
#stage::before{content:"";position:absolute;inset:0;background:radial-gradient(120% 70% at 20% 100%,rgba(38,52,42,.95),rgba(26,28,26,0) 70%),radial-gradient(90% 50% at 100% 0%,rgba(38,52,42,.7),rgba(26,28,26,0) 70%)}
#app{position:absolute;inset:0}
.logo{display:block;fill:var(--creme)}
/* Kopfleiste */
.top{position:absolute;left:0;right:0;top:0;height:132px;display:flex;align-items:center;justify-content:space-between;padding:0 40px;z-index:5;border-bottom:1px solid var(--l)}
.top .logo{width:190px;height:46px}
.wait{display:flex;flex-direction:column;align-items:flex-start;margin-left:28px;margin-right:auto}
.wait b{font-family:'Archivo';font-stretch:125%;font-weight:800;font-size:30px;line-height:1}
.wait span{font-family:'JB Mono';font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--eis);margin-top:6px}
.pills{display:flex;gap:12px}
.pill{height:62px;padding:0 22px;border-radius:12px;border:1px solid var(--l2);font-size:22px;font-weight:600;display:flex;align-items:center;gap:10px;white-space:nowrap}
.pill.on{background:var(--creme);color:var(--basalt)}
.pill b{background:var(--eis);color:var(--basalt);border-radius:8px;min-width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;font-size:18px;padding:0 6px}
/* Start */
.attract{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:120px 70px 80px;text-align:center;background:var(--basalt)}
.attract video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
.attract>*{position:relative;z-index:1}
.attract .logo{width:640px;height:156px}
.attract .lbl{font-family:'JB Mono';font-size:24px;letter-spacing:.14em;color:var(--eis);margin-top:28px}
.attract h1{margin:0;font-size:150px;line-height:.9}
.attract .sub{font-size:32px;color:rgba(234,228,215,.86);margin-top:24px;line-height:1.3}
.hero{height:640px;width:100%;position:relative}
.hero img{position:absolute;left:50%;top:50%;height:640px;width:auto;transform:translate(-50%,-50%);opacity:0;animation:fade 16s infinite}
.hero img:nth-child(2){animation-delay:4s}.hero img:nth-child(3){animation-delay:8s}.hero img:nth-child(4){animation-delay:12s}
@keyframes fade{0%{opacity:0;transform:translate(-50%,-47%) scale(.97)}6%,22%{opacity:1;transform:translate(-50%,-50%) scale(1)}28%,100%{opacity:0;transform:translate(-50%,-52%) scale(1.02)}}
.cta{height:140px;padding:0 80px;border-radius:14px;background:var(--creme);color:var(--basalt);font-family:'Archivo';font-stretch:125%;font-weight:800;font-size:46px;display:inline-flex;align-items:center;gap:24px;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.03)}}
.attract .w2{font-family:'JB Mono';font-size:20px;letter-spacing:.1em;color:var(--eis);margin-top:22px;text-transform:uppercase}
.attract.vid>.logo,.attract.vid>.lbl,.attract.vid>div:not(.foot):not(.ctaw),.attract.vid>h1{visibility:hidden}
.foot{position:absolute;left:40px;right:40px;bottom:18px;font-family:'JB Mono';font-size:15px;line-height:1.4;color:rgba(234,228,215,.55);text-align:center;z-index:2}
/* Wahl */
.mode{position:absolute;left:0;right:0;top:132px;bottom:0;padding:70px 70px 100px;display:flex;flex-direction:column;gap:40px}
.mode h2,.h2{margin:0;font-size:100px;line-height:.92}
.mode p{margin:-16px 0 0;font-size:28px;color:var(--dim)}
.bigbtn{flex:1;border-radius:14px;border:1px solid var(--l2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;font-family:'Archivo';font-stretch:125%;font-weight:800;font-size:96px;line-height:.92}
.bigbtn small{font-size:28px;font-weight:500;font-family:'DM Sans';font-stretch:100%;letter-spacing:0;color:var(--dim)}
.bigbtn.b{background:var(--moos);border-color:var(--moos)}
.bigbtn .mono{font-size:20px;color:var(--eis);letter-spacing:.12em}
/* Menue */
.menu{position:absolute;left:0;right:0;top:132px;bottom:170px;display:flex}
.rail{width:236px;padding:22px 0 20px 26px;display:flex;flex-direction:column;gap:8px;overflow:auto;border-right:1px solid var(--l)}
.rail button{min-height:92px;border-radius:12px 0 0 12px;font-family:'Archivo';font-stretch:125%;font-weight:800;font-size:27px;line-height:1;text-align:left;padding:0 18px;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:6px;color:var(--dim)}
.rail button small{font-family:'JB Mono';font-weight:500;font-size:13px;letter-spacing:.1em;color:rgba(234,228,215,.45)}
.rail button.on{background:var(--moos);color:var(--creme)}
.rail button.on small{color:var(--eis)}
.grid{flex:1;overflow:auto;padding:22px 32px 40px 26px;display:grid;grid-template-columns:1fr 1fr;gap:20px;align-content:start}
.grid .head{grid-column:1/-1;display:flex;align-items:flex-end;justify-content:space-between;gap:20px;padding-bottom:10px;border-bottom:1px solid var(--l2);margin-bottom:4px}
.grid .head h2{margin:0;font-size:78px;line-height:.92}
.grid .head span{font-family:'JB Mono';font-size:16px;letter-spacing:.08em;text-transform:uppercase;color:var(--eis);text-align:right;max-width:300px;line-height:1.35}
.card{border:1px solid var(--l);border-radius:14px;padding:14px 16px 18px;display:flex;flex-direction:column;position:relative;background:rgba(26,28,26,.55)}
.card.sold{opacity:.4;pointer-events:none}
.card .im{height:270px;border-radius:10px;background:var(--moos);position:relative;overflow:hidden;margin-bottom:14px}
.card .im img{width:100%;height:100%;object-fit:cover;display:block}
.card .im.cut img{object-fit:contain;padding:12px}
.card .im .kb{position:absolute;inset:0;display:flex}
.card .im .kb img{width:50%;object-fit:contain;padding:10px}
.stk{position:absolute;left:10px;top:10px;min-width:56px;height:38px;padding:0 10px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-family:'JB Mono';font-weight:700;font-size:18px;z-index:2}
.card h3{margin:0;font-size:31px;line-height:1.02;text-transform:lowercase}
.card p{margin:8px 0 0;font-size:20px;line-height:1.3;color:rgba(234,228,215,.82);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:52px}
.card .al{font-family:'JB Mono';font-size:15px;color:rgba(234,228,215,.5);letter-spacing:.1em;margin-top:8px;min-height:20px;text-transform:uppercase}
.card .bt{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.price{font-family:'Archivo';font-stretch:125%;font-weight:800;font-size:44px;line-height:1}
.price small{font-size:16px;font-family:'JB Mono';font-stretch:100%;letter-spacing:.08em;text-transform:uppercase;font-weight:500;color:var(--eis);display:block;margin-top:6px}
.add{width:72px;height:72px;border-radius:12px;background:var(--creme);color:var(--basalt);font-size:46px;font-weight:400;display:flex;align-items:center;justify-content:center;line-height:1}
.tag{display:inline-flex;align-items:center;justify-content:center;height:1em;padding:0 .4em;border-radius:6px;background:var(--eis);color:var(--basalt);font-family:'JB Mono';font-size:.48em;font-weight:700;letter-spacing:.06em;vertical-align:.32em;margin-left:.45em;font-stretch:100%}
.warn{position:absolute;right:12px;top:12px;z-index:3;background:var(--creme);color:var(--basalt);font-size:17px;font-weight:700;border-radius:9px;padding:7px 12px;max-width:72%}
.soldtag{position:absolute;left:50%;top:120px;transform:translateX(-50%) rotate(-4deg);z-index:4;background:var(--creme);color:var(--basalt);font-family:'Archivo';font-stretch:125%;font-weight:800;font-size:32px;padding:10px 24px;border-radius:10px}
.season{font-family:'JB Mono';font-size:14px;letter-spacing:.1em;color:var(--eis);text-transform:uppercase;margin-top:6px}
/* Warenkorb Leiste */
.bar{position:absolute;left:0;right:0;bottom:0;height:170px;border-top:1px solid var(--l2);background:var(--basalt);display:flex;align-items:center;justify-content:space-between;padding:0 40px;z-index:6}
.bar .t{font-family:'JB Mono';font-size:18px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.bar .s{font-family:'Archivo';font-stretch:125%;font-weight:800;font-size:54px;margin-top:6px}
.bar .wt{font-family:'JB Mono';font-size:15px;color:var(--eis);letter-spacing:.08em;margin-top:6px;text-transform:uppercase}
.go{height:110px;padding:0 54px;border-radius:14px;background:var(--creme);color:var(--basalt);font-family:'Archivo';font-stretch:125%;font-weight:800;font-size:36px}
.go:disabled{opacity:.3}
.go.g{background:none;border:1px solid var(--l2);color:var(--creme)}
/* Blatt */
.scrim{position:absolute;inset:0;background:rgba(10,11,10,.72);z-index:20}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:1640px;background:var(--basalt);border-top:1px solid var(--l2);border-radius:18px 18px 0 0;z-index:21;display:flex;flex-direction:column}
.sheet .x{position:absolute;right:26px;top:22px;width:74px;height:74px;border-radius:12px;border:1px solid var(--l2);font-size:44px;z-index:3;background:var(--basalt)}
.sheet .body{overflow:auto;padding:34px 46px 20px}
.sheet .pic{height:400px;border-radius:12px;background:var(--moos);overflow:hidden;margin-bottom:24px;position:relative}
.sheet .pic img{width:100%;height:100%;object-fit:cover}
.sheet .pic.cut img{object-fit:contain;padding:16px}
.sheet .pic .kb{position:absolute;inset:0;display:flex}.sheet .pic .kb img{width:50%;object-fit:contain;padding:18px}
.sheet h2{margin:0;font-size:62px;line-height:.98;text-transform:lowercase}
.sheet .d{font-size:26px;line-height:1.35;margin:12px 0 0;color:rgba(234,228,215,.88)}
.sheet .z{font-family:'JB Mono';font-size:17px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin:14px 0 0;line-height:1.5}
.sheet .a{font-size:21px;line-height:1.35;margin:12px 0 0;color:var(--eis)}
.grp{margin-top:30px}
.grp h4{margin:0 0 14px;font-family:'Archivo';font-stretch:125%;font-weight:800;font-size:34px;display:flex;justify-content:space-between;align-items:baseline;gap:20px;text-transform:lowercase}
.grp h4 span{font-family:'JB Mono';font-size:15px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--eis);text-align:right}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.opt{min-height:98px;border-radius:12px;border:1px solid var(--l2);padding:16px 20px;text-align:left;font-size:25px;font-weight:600;position:relative;display:flex;flex-direction:column;justify-content:center}
.opt small{font-size:18px;font-weight:400;color:var(--dim);margin-top:5px;line-height:1.3}
.opt .pl{position:absolute;right:18px;top:16px;font-family:'Archivo';font-stretch:125%;font-weight:800;font-size:24px}
.opt.on{background:var(--creme);color:var(--basalt);border-color:var(--creme)}
.opt.on small{color:rgba(26,28,26,.75)}
.opt:disabled{opacity:.32}
.opt .w{font-size:16px;font-weight:700;color:var(--basalt);background:var(--eis);border-radius:7px;padding:3px 8px;margin-top:8px;align-self:flex-start}
.opt.on .w{background:var(--basalt);color:var(--eis)}
.note{margin-top:14px;font-size:20px;line-height:1.35;border:1px solid rgba(188,212,212,.6);border-radius:12px;padding:14px 18px;color:var(--eis)}
.sum2{margin-top:26px;font-size:22px;line-height:1.4;color:var(--dim)}
.sum2 b{color:var(--creme)}
.foot2{padding:22px 46px 34px;border-top:1px solid var(--l);display:flex;gap:18px;align-items:center}
.step{display:flex;align-items:center;gap:6px}
.step button{width:84px;height:84px;border-radius:12px;border:1px solid var(--l2);font-size:44px}
.step button:disabled{opacity:.3}
.step span{min-width:60px;text-align:center;font-family:'Archivo';font-stretch:125%;font-weight:800;font-size:40px}
.add2{flex:1;height:110px;border-radius:14px;background:var(--creme);color:var(--basalt);font-family:'Archivo';font-stretch:125%;font-weight:800;font-size:30px;display:flex;justify-content:space-between;align-items:center;padding:0 34px}
.add2:disabled{opacity:.35}
/* Seiten */
.page{position:absolute;left:0;right:0;top:132px;bottom:170px;overflow:auto;padding:50px 50px 40px}
.lead{font-size:26px;color:var(--dim);margin:14px 0 30px;line-height:1.35}
.urow,.crow{display:flex;align-items:center;gap:22px;border-top:1px solid var(--l);padding:20px 0}
.urow .im,.crow .im{width:150px;height:150px;border-radius:10px;background:var(--moos);overflow:hidden;flex:none;position:relative}
.urow .im img,.crow .im img{width:100%;height:100%;object-fit:contain;padding:8px}
.urow .im.cov img,.crow .im.cov img{object-fit:cover;padding:0}
.urow .tx,.crow .tx{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}
.urow .tx b,.crow .tx b{font-family:'Archivo';font-stretch:125%;font-weight:800;font-size:32px;line-height:1.02;text-transform:lowercase}
.urow .tx span,.crow .tx span{font-size:20px;color:var(--dim);line-height:1.3}
.crow .tx .ac{font-family:'JB Mono';font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:rgba(234,228,215,.5)}
.crow .rm{align-self:flex-start;font-size:19px;color:var(--eis);text-decoration:underline;margin-top:4px}
.crow .pr{width:150px;text-align:right;font-family:'Archivo';font-stretch:125%;font-weight:800;font-size:32px}
.crow .step button{width:66px;height:66px;font-size:34px}.crow .step span{min-width:40px;font-size:30px}
.uh{font-family:'Archivo';font-stretch:125%;font-weight:800;font-size:40px;margin:26px 0 6px;text-transform:lowercase}
.sum{margin-top:20px;border-top:1px solid var(--l2);padding-top:20px}
.sum div{display:flex;justify-content:space-between;font-size:24px;padding:6px 0;color:var(--dim)}
.sum .tot{font-family:'Archivo';font-stretch:125%;font-weight:800;font-size:46px;color:var(--creme);padding-top:14px}
.hint{font-size:22px;border:1px solid rgba(188,212,212,.6);border-radius:12px;padding:16px 20px;color:var(--eis);line-height:1.35}
.skip{height:90px;padding:0 40px;border-radius:12px;border:1px solid var(--l2);font-size:24px;font-weight:600}
.payopts{display:flex;flex-direction:column;gap:30px;height:1040px}
.demo{position:absolute;left:50px;bottom:200px;font-size:20px;color:var(--dim);display:flex;gap:12px;align-items:center}
.demo input{width:30px;height:30px}
.center{position:absolute;left:0;right:0;top:132px;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:30px;text-align:center;padding:0 80px}
.center h2{margin:0;font-size:80px;line-height:.95}
.center p{font-size:28px;color:var(--dim);margin:0;line-height:1.4}
.ring{width:200px;height:200px;border-radius:50%;border:3px solid var(--l2);border-top-color:var(--creme);animation:spin 1.1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.row2{display:flex;gap:20px;width:100%}.row2 button{flex:1;height:100px;border-radius:12px;background:var(--creme);color:var(--basalt);font-size:28px;font-weight:700}.row2 button.g{background:none;border:1px solid var(--l2);color:var(--creme)}
.done{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding:110px 70px 90px;text-align:center;gap:18px}
.done .logo{width:300px;height:73px;margin-bottom:30px}
.done .k{font-family:'JB Mono';font-size:22px;letter-spacing:.14em;color:var(--eis)}
.done .n{font-family:'Archivo';font-stretch:125%;font-weight:800;font-size:300px;line-height:.9;letter-spacing:-.03em}
.done h2{margin:0;font-size:56px;line-height:1}
.done p{font-size:26px;color:var(--dim);margin:0;max-width:880px;line-height:1.4}
.eta{display:flex;gap:16px;align-items:center;border:1px solid var(--l2);border-radius:14px;padding:18px 28px;margin-top:10px}
.eta b{font-family:'Archivo';font-stretch:125%;font-weight:800;font-size:54px}.eta span{font-size:22px;color:var(--dim);text-align:left;line-height:1.3}
.bon{width:760px;border:1px solid var(--l2);border-radius:12px;padding:24px 30px;text-align:left;font-family:'JB Mono';font-size:18px;line-height:1.5;margin-top:10px;color:rgba(234,228,215,.85)}
.bon div{display:flex;justify-content:space-between;gap:20px}.bon hr{border:0;border-top:1px dashed var(--l2);margin:10px 0}
.done .cta{animation:none;height:120px;font-size:36px;margin-top:auto}
/* Dialog */
.dlg{position:absolute;left:70px;right:70px;top:50%;transform:translateY(-50%);background:var(--basalt);border:1px solid var(--l2);border-radius:16px;padding:46px;z-index:31}
.dlg h3{margin:0;font-size:58px;line-height:1;text-transform:lowercase}
.dlg p{font-size:24px;color:var(--dim);line-height:1.4}
.dlg h5{margin:26px 0 12px;font-family:'JB Mono';font-size:16px;letter-spacing:.12em;text-transform:uppercase;color:var(--eis);font-weight:500}
.acb{display:flex;flex-wrap:wrap;gap:12px}
.acb button{height:72px;padding:0 24px;border-radius:12px;border:1px solid var(--l2);font-size:23px;font-weight:600}
.acb button.on{background:var(--creme);color:var(--basalt)}
.dlg .row2{margin-top:34px}
.dlg .cdn{font-family:'Archivo';font-stretch:125%;font-weight:800;font-size:150px;text-align:center}
.scrim.d{z-index:30}
.toast{position:absolute;left:50%;bottom:200px;transform:translateX(-50%);background:var(--creme);color:var(--basalt);font-size:24px;font-weight:700;padding:20px 32px;border-radius:12px;z-index:40;white-space:nowrap}
/* Barrierefrei: Inhalt unten, groessere Schrift */
.accband{display:none}
#stage.access #app{top:700px}
#stage.access .accband{display:flex;flex-direction:column;justify-content:center;position:absolute;left:0;right:0;top:0;height:700px;padding:0 70px;background:var(--moos);gap:20px}
.accband div{font-family:'Archivo';font-stretch:125%;font-weight:800;font-size:70px;line-height:1}.accband small{font-size:30px;line-height:1.35;color:rgba(234,228,215,.85)}
#stage.access .card h3{font-size:36px}#stage.access .card p{font-size:23px}
#stage.access .menu{bottom:170px}#stage.access .card .im{height:180px}
/* Kueche */
.k-wrap{position:absolute;inset:0;display:flex;flex-direction:column;padding:24px 28px 20px;gap:18px}
.k-top{display:flex;align-items:center;gap:26px;border-bottom:1px solid var(--l);padding-bottom:16px}
.k-top .logo{width:150px;height:37px}
.k-top h1{margin:0;font-size:46px;line-height:1;margin-right:auto}
.k-top .q{font-family:'JB Mono';font-size:16px;letter-spacing:.08em;color:var(--eis);text-transform:uppercase}
.k-btn{height:54px;padding:0 20px;border-radius:10px;border:1px solid var(--l2);font-size:18px;font-weight:600}
.k-btn.on{background:var(--creme);color:var(--basalt)}
.k-cols{flex:1;display:grid;grid-template-columns:1fr 1fr 1fr 340px;gap:18px;min-height:0}
.k-col{border:1px solid var(--l);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px;overflow:hidden;min-height:0}
.k-col h2{margin:0;font-size:30px;display:flex;justify-content:space-between;align-items:center;text-transform:lowercase}
.k-col h2 span:last-child{font-family:'JB Mono';font-size:16px;font-weight:700;background:var(--moos);border-radius:8px;padding:4px 10px;letter-spacing:.04em}
.k-col .sub{font-family:'JB Mono';font-size:13px;letter-spacing:.1em;color:var(--eis);text-transform:uppercase;margin-top:-6px}
.k-col .list{display:flex;flex-direction:column;gap:12px;overflow:auto;min-height:0}
.tk{background:var(--creme);color:var(--basalt);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;border-left:10px solid var(--moos)}
.tk.late{border-left-color:#B5532E}
.tk.done{opacity:.5}
.tk .h{display:flex;justify-content:space-between;align-items:baseline}
.tk .h b{font-family:'Archivo';font-stretch:125%;font-weight:800;font-size:40px;line-height:1}
.tk .h span{font-family:'JB Mono';font-size:17px;font-weight:700}
.tk .m{font-family:'JB Mono';font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:rgba(26,28,26,.7)}
.tk .l{border-top:1px solid rgba(26,28,26,.18);padding-top:8px;display:flex;flex-direction:column;gap:3px}
.tk .l b{font-size:21px;font-weight:700;display:flex;align-items:center;gap:10px}
.tk .l b i{display:inline-block;width:16px;height:16px;border-radius:4px;flex:none}
.tk .l em{font-style:normal;font-size:17px;font-weight:600}
.tk .l small{font-family:'JB Mono';font-size:13px;letter-spacing:.06em;color:rgba(26,28,26,.65);text-transform:uppercase}
.tk button{height:58px;border-radius:10px;background:var(--basalt);color:var(--creme);font-size:20px;font-weight:700;margin-top:4px}
.tk .ok{font-family:'JB Mono';font-size:15px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--moos)}
.k-side{display:flex;flex-direction:column;gap:18px;min-height:0}
.k-side .k-col{flex:1}
.k-draw{position:absolute;right:28px;top:96px;bottom:20px;width:560px;background:var(--basalt);border:1px solid var(--l2);border-radius:14px;padding:24px;overflow:auto;z-index:10}
.k-draw h3{margin:0 0 16px;font-size:32px;text-transform:lowercase}
.k-draw .it{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-top:1px solid var(--l);font-size:19px}
.k-draw .it button{height:44px;padding:0 16px;border-radius:9px;border:1px solid var(--l2);font-size:16px;font-weight:600}
.k-draw .it button.on{background:var(--creme);color:var(--basalt)}
/* Abholung */
.r-wrap{position:absolute;inset:0;display:grid;grid-template-columns:1.25fr 520px 1fr}
.r-wrap section{padding:56px 56px 40px;display:flex;flex-direction:column;gap:24px;min-width:0}
.r-a{background:var(--moos)}
.r-wrap h1{margin:0;font-size:86px;line-height:.9}
.r-wrap .k{font-family:'JB Mono';font-size:20px;letter-spacing:.14em;color:var(--eis)}
.nums{display:flex;flex-wrap:wrap;gap:20px;align-content:flex-start}
.r-a .nums span{font-family:'Archivo';font-stretch:125%;font-weight:800;font-size:150px;line-height:1;min-width:300px;letter-spacing:-.03em}
.r-c .nums{flex-direction:column;gap:6px}
.r-c .nums div{width:100%;display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--l);padding:12px 0}
.r-c .nums b{font-family:'Archivo';font-stretch:125%;font-weight:800;font-size:64px;line-height:1;color:rgba(234,228,215,.8)}
.r-c .nums span{font-family:'JB Mono';font-size:20px;color:var(--eis);letter-spacing:.06em}
.empty{font-size:28px;color:var(--dim);line-height:1.4;max-width:600px}
.r-b{align-items:center;justify-content:center;text-align:center;border-left:1px solid var(--l);border-right:1px solid var(--l)}
.cube{width:300px;height:300px;position:relative;transform-style:preserve-3d;transform:rotateX(-24deg) rotateY(-38deg);margin:110px 0 80px}
.cube div{position:absolute;inset:0;border:1px solid rgba(234,228,215,.5);display:flex;align-items:center;justify-content:center}
.cube .f1{transform:translateZ(150px);background:linear-gradient(160deg,#D9E6E5,#9FBFC0)}
.cube .f2{transform:rotateY(90deg) translateZ(150px);background:linear-gradient(160deg,#C4D7D7,#7FA3A4)}
.cube .f3{transform:rotateX(90deg) translateZ(150px);background:#E6EFEE}
.cube .f1 svg{width:150px;height:150px}
.r-b{position:relative}
.glow{position:absolute;left:50%;top:230px;margin-left:-260px;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,rgba(188,212,212,.35),rgba(188,212,212,0) 65%);animation:breathe 4s ease-in-out infinite}

.r-b .s{font-size:22px;color:var(--dim);line-height:1.4;max-width:400px}
.r-b .logo{width:200px;height:49px;margin-top:auto}
.r-foot{position:absolute;left:56px;bottom:20px;width:660px;line-height:1.4;font-family:'JB Mono';font-size:13px;color:rgba(234,228,215,.5)}
</style>

function stationMins(parts){
  var m = {}, n = {};
  parts.forEach(function(p){ if(p.tresen){ m.kaffee = m.kaffee || 0; return; } var k = p.st + (p.st === "toast" && p.pfanne ? "P" : ""); n[k] = (n[k] || 0) + p.qty; m[p.st] = m[p.st] || 0; });
  Object.keys(n).forEach(function(k){ var st = k.replace("P", ""), def = R.minuten[k.slice(-1) === "P" ? "pfanne" : st]; m[st] = Math.max(m[st], 0) + def[0] + (n[k] - 1) * def[1]; });
  if(m.kaffee === 0) m.kaffee = 0.5;
  return m;
}
function queue(){ var q = {smoothie: 0, toast: 0, kaffee: 0}; db().forEach(function(o){ if(o.status !== "open") return; Object.keys(o.st).forEach(function(s){ if(o.st[s] === "open") q[s] += o.mins[s] || 0; }); }); return q; }

  if(!kat("Shots")) out.push({kind: "item", why: "Für unterwegs, sofort", ids: byKat("Shots").map(function(i){ return i.id; })});
  if(kat("Kaffee") && !kat("Gebäck") && !c.some(function(l){ return l.id === "kombi-morgen"; })) out.push({kind: "item", why: "Zum Kaffee", ids: byKat("Gebäck").map(function(i){ return i.id; })});

    var it = I[l.id], o = lineOpts(l), al = lineAll(l);
    return '<div class="crow">' + thumb(l.id) + '<div class="tx"><b>' + esc(it.name) + tags(it) + "</b>" + (o.length ? "<span>" + esc(o.join(" · ")) + "</span>" : "") + '<span class="ac">' + (al.length ? "Allergene: " + al.join(" ") : "Keine Hauptallergene") + (l.gf ? " · Kreuzkontakt Gluten möglich" : "") + '</span><button class="rm" data-a="c-rm" data-v="' + l.uid + '">Entfernen</button></div>' +
      '<div class="step"><button data-a="c-" data-v="' + l.uid + '">−</button><span>' + l.qty + '</span><button data-a="c+" data-v="' + l.uid + '"' + (l.qty >= R.max_qty ? " disabled" : "") + '>+</button></div><div class="pr">' + eur(lineTotal(l)) + "</div></div>";
  }).join("");
  return '<div class="page"><h2 class="h2">dein warenkorb</h2>' + (S.cart.length ? rows : '<p class="lead">Dein Warenkorb ist leer.</p>') +
    (S.cart.length ? '<div class="sum"><div><span>' + cartCount() + " Artikel · " + (S.mode === "go" ? "Mitnahme" : "Im Laden") + "</span><span>" + eur(cartTotal()) + '</span></div><div><span>Alles wird frisch gemacht</span><span>ca. ' + eta(cartParts()) + ' Min.</span></div><div class="tot"><span>Gesamt</span><span>' + eur(cartTotal()) + "</span></div><div><small>inkl. MwSt., Aufteilung auf dem Beleg der Kasse</small><small></small></div></div>" : "") +
    (many ? '<p class="hint" style="margin-top:20px">Große Bestellung: Komm bitte kurz zum Tresen, dann planen wir die Reihenfolge mit dir.</p>' : "") +
    '<button class="skip" style="margin-top:24px" data-a="more">Noch etwas bestellen</button></div>';
}
function vPay(){
  return '<div class="page"><h2 class="h2">wie zahlst du?</h2><p class="lead">Gesamt ' + eur(cartTotal()) + '. Die Bezahlung ist im Prototyp nur simuliert.</p><div class="payopts">' +
    '<button class="bigbtn b" data-a="pm" data-v="card"><span class="mono">[ KARTE ]</span>karte<small>Girocard, Kreditkarte, Handy am Terminal</small></button>' +
    '<button class="bigbtn" data-a="pm" data-v="cash"><span class="mono">[ TRESEN ]</span>bar am tresen<small>Du bekommst eine Nummer und zahlst an der Kasse</small></button></div></div>' +
    '<label class="demo"><input type="checkbox" data-a="failtoggle"' + (S.payfail ? " checked" : "") + "> Demo: Kartenzahlung wird abgelehnt (Fehlerfall testen)</label>" +
    '<div class="bar"><div><div class="t">Gesamt</div><div class="s">' + eur(cartTotal()) + '</div></div><button class="go g" data-a="back-cart">Zurück</button></div>';
}
function vPaying(){ return '<div class="center"><div class="ring"></div><h2>karte oder handy halten</h2><p>' + eur(cartTotal()) + " am Terminal bezahlen. Das dauert nur einen Moment.</p></div>"; }
function vFail(){ return '<div class="center"><h2>zahlung nicht möglich</h2><p>Die Karte wurde abgelehnt. Deine Bestellung bleibt im Warenkorb. Versuch es noch einmal oder zahl bar am Tresen.</p><div class="row2" style="width:900px"><button data-a="pm" data-v="card">Nochmal versuchen</button><button class="g" data-a="pm" data-v="cash">Bar am Tresen</button></div><button class="skip" data-a="back-cart">Zurück zum Warenkorb</button></div>'; }
function vDone(){
  var o = S.last, cash = o.pay.method === "cash";
  var lines = o.lines.map(function(l){ return "<div><span>" + l.qty + "× " + esc(l.name) + "</span><span>" + eur(l.total) + "</span></div>" + (l.opts.length ? '<div style="opacity:.7"><span>  ' + esc(l.opts.join(", ")) + "</span></div>" : ""); }).join("");
  return '<div class="done">' + logo() + '<div class="k">[ DEINE NUMMER ]</div><div class="n">' + o.number + "</div><h2>" + (cash ? "bitte jetzt am tresen zahlen" : "bezahlt, danke.") + "</h2>" +
    "<p>" + (cash ? "Zeig deine Nummer am Tresen. Sobald du bezahlt hast, mixen und toasten wir los." : "Wir machen alles frisch. Deine Nummer leuchtet auf dem Abholmonitor, dein Becher steht dann am Pickup Würfel.") + "</p>" +
    '<div class="eta"><b>ca. ' + o.eta + ' min</b><span>Wartezeit, weil alles<br>frisch gemacht wird</span></div>' +
    '<div class="bon"><b>Beleg Vorschau (Platzhalter)</b><hr>' + lines + "<hr><div><span>Gesamt inkl. MwSt.</span><b>" + eur(o.total) + "</b></div><div><span>Zahlart</span><span>" + (cash ? "Bar am Tresen" : "Karte (simuliert)") + "</span></div><div><span>" + (o.mode === "go" ? "Mitnahme" : "Im Laden") + "</span><span>Nr. " + o.number + "</span></div><hr><span>Betreiber, Adresse, USt IdNr., MwSt. Aufteilung und TSE Daten kommen von der Kasse.</span></div>" +
    '<button class="cta" data-a="newo">Neue Bestellung</button></div>' +
    '<div class="foot">' + esc(M.foot) + " Es wurde nichts bezahlt, der Prototyp simuliert.</div>";
}
function vDlg(){
  var d = S.dlg;
  if(d === "filter") return '<div class="scrim d" data-a="dlgx"></div><div class="dlg"><h3>ich vermeide</h3><p>Wir blenden aus oder markieren, was nicht passt. Bestellen bleibt möglich, die Entscheidung liegt bei dir. Vegan steht nur, wo die Karte es sagt.</p><h5>Ernährung</h5><div class="acb"><button class="' + (S.diet === "v" ? "on" : "") + '" data-a="diet" data-v="v">Nur vegetarisch</button><button class="' + (S.diet === "vg" ? "on" : "") + '" data-a="diet" data-v="vg">Nur vegan</button></div><h5>Allergene</h5><div class="acb">' +
    Object.keys(M.codes).map(function(c){ return '<button class="' + (S.filter.indexOf(c) > -1 ? "on" : "") + '" data-a="ftog" data-v="' + c + '">' + M.codes[c] + "</button>"; }).join("") + '</div><p style="font-size:20px;margin-top:22px">Glutenfreies Brot gibt es auf Anfrage, Kreuzkontakt im Toaster ist möglich.</p><div class="row2"><button class="g" data-a="fclear">Alle zurücksetzen</button><button data-a="dlgx">Fertig</button></div></div>';
  if(d === "cancel") return '<div class="scrim d" data-a="dlgx"></div><div class="dlg"><h3>bestellung abbrechen?</h3><p>Dein Warenkorb wird geleert und wir gehen zurück zum Start.</p><div class="row2"><button class="g" data-a="dlgx">Weiter bestellen</button><button data-a="reset">Abbrechen</button></div></div>';
  if(d === "idle") return '<div class="scrim d"></div><div class="dlg"><h3>bist du noch da?</h3><p>Ohne Eingabe gehen wir gleich zurück zum Start.</p><div class="cdn">' + S.countdown + '</div><div class="row2"><button data-a="dlgx">Ja, weiter</button></div></div>';
  return "";
}

/* ---------------- Aktionen ---------------- */
function reset(){ S.screen = "attract"; S.mode = null; S.cart = []; S.sheet = null; S.dlg = null; S.cat = "Smoothies"; S.upDone = false; S.last = null; S.toast = null; clearTimeout(doneTimer); render(); }
function complete(method){ S.last = placeOrder(method); S.screen = "done"; S.cart = []; S.sheet = null; render(); clearTimeout(doneTimer); doneTimer = setTimeout(function(){ if(S.screen === "done") reset(); }, 20000); }
function needsSheet(it){ return !!(it.kombi || it.o_prot || it.o_tops || it.o_gf || it.o_milk); }
function toggle(arr, v){ var i = arr.indexOf(v); if(i > -1) arr.splice(i, 1); else arr.push(v); }
function mergeKombi(){
  var t = S.cart.filter(function(l){ return I[l.id].kat === "Toasts"; })[0], s = S.cart.filter(function(l){ return I[l.id].kat === "Smoothies"; })[0]; if(!t || !s) return;
  var k = newLine(I["kombi-fuel"]); k.a = t.id; k.b = s.id; k.gf = t.gf; k.prot = s.prot;
  [t, s].forEach(function(x){ x.qty--; }); S.cart = S.cart.filter(function(x){ return x.qty > 0; }); addLine(k);
}
function act(a, v){
  lastTouch = Date.now();
  var l = S.sheet && S.sheet.line;
  switch(a){
    case "start": S.screen = "mode"; break;
    case "mode": S.mode = v; S.screen = "menu"; break;
    case "cat": S.cat = v; break;
    case "card": var it = I[v]; if(isSold(it)) return;
      if(needsSheet(it)){ S.sheet = {line: newLine(it)}; S.fresh = true; } else { addLine(newLine(it)); toast(it.name + " liegt im Warenkorb"); return; } break;
    case "sheetx": S.sheet = null; break;
    case "milk": l.milk = v; break;
    case "gf": l.gf = v === "1"; break;
    case "prot": l.prot = v === "1"; break;
    case "top": toggle(l.tops, v); break;
    case "ka": l.a = v; if(!I[v].o_milk) l.milk = "kuh"; break;
    case "kb": l.b = v; break;
    case "q+": l.qty = Math.min(R.max_qty, l.qty + 1); break;
    case "q-": l.qty = Math.max(1, l.qty - 1); break;
    case "addline": if(missing(l)) return; var nm = I[l.id].name; addLine(l); S.sheet = null; toast(nm + " liegt im Warenkorb"); return;
    case "checkout": if(!S.cart.length) return; S.screen = (!S.upDone && upsell().length) ? "upsell" : "cart"; break;
    case "u-add": addLine(newLine(I[v])); toast(I[v].name + " liegt im Warenkorb"); if(!upsell().length) S.screen = "cart"; return;
    case "u-kombi": mergeKombi(); toast("Fuel Kombi liegt im Warenkorb"); if(!upsell().length) S.screen = "cart"; return;
    case "skip": S.upDone = true; S.screen = "cart"; break;
    case "more": S.screen = "menu"; break;
    case "c+": S.cart.forEach(function(x){ if(x.uid == v) x.qty = Math.min(R.max_qty, x.qty + 1); }); break;
    case "c-": S.cart.forEach(function(x){ if(x.uid == v) x.qty = Math.max(1, x.qty - 1); }); break;
    case "c-rm": S.cart = S.cart.filter(function(x){ return x.uid != v; }); if(!S.cart.length) S.screen = "menu"; break;
    case "topay": S.screen = "pay"; break;
    case "back-cart": S.screen = "cart"; break;
    case "failtoggle": S.payfail = !S.payfail; break;
    case "pm":
      if(v === "cash"){ complete("cash"); return; }
      S.screen = "paying"; render(); setTimeout(function(){ if(S.screen !== "paying") return; if(S.payfail){ S.screen = "payfail"; render(); } else complete("card"); }, 2600); return;
    case "newo": reset(); return;
    case "filter": S.dlg = "filter"; break;
    case "ftog": toggle(S.filter, v); break;
    case "diet": S.diet = S.diet === v ? null : v; break;
    case "fclear": S.filter = []; S.diet = null; break;
    case "access": S.access = !S.access; break;
    case "cancel": S.dlg = "cancel"; break;
    case "dlgx": S.dlg = null; break;
    case "reset": reset(); return;
  }
  render();
}
app.addEventListener("click", function(e){
  if(VIEW !== "kiosk") return;
  var t = e.target.closest("[data-a]"); if(!t || t.disabled) return;
  if(t.tagName === "LABEL") return; if(t.classList.contains("scrim") && S.dlg === "idle") return;
  e.stopPropagation(); act(t.getAttribute("data-a"), t.getAttribute("data-v"));
});
["pointerdown", "keydown"].forEach(function(ev){ addEventListener(ev, function(){ lastTouch = Date.now(); }); });
if(VIEW === "kiosk") setInterval(function(){
  if(S.screen === "attract" || S.screen === "done" || S.screen === "paying") return;
  var idle = (Date.now() - lastTouch) / 1000;
  if(idle >= R.idle_s && S.dlg !== "idle"){ S.dlg = "idle"; S.countdown = R.idle_cd; render(); }
  else if(S.dlg === "idle"){ S.countdown = Math.max(0, R.idle_s + R.idle_cd - Math.floor(idle)); if(S.countdown <= 0) reset(); else render(); }
}, 1000);

/* ---------------- Küchenmonitor: Bon je Station ---------------- */
var K_OPEN = false, SNAME = {smoothie: ["smoothie", "Smoothies und Bowls"], toast: ["toast", "Toasts und Pfanne"], kaffee: ["kaffee", "Kaffee, Shots, Gebäck"]};
function mins(o){ return Math.max(0, Math.floor((Date.now() - new Date(o.started || o.created).getTime()) / 60000)); }
function ticket(o, s){
  var ps = o.parts.filter(function(p){ return p.st === s; }), late = mins(o) >= R.late_min;
  var lines = ps.map(function(p){ return '<div class="l"><b>' + (p.farbe ? '<i style="background:' + p.farbe + '"></i>' : "") + p.qty + "× " + esc(p.name) + "</b>" + (p.tresen ? "<em>vom Tresen</em>" : "") + (p.opts.length ? "<em>" + p.opts.map(esc).join(" · ") + "</em>" : "") + (p.all.length ? "<small>Allergene: " + p.all.join(" ") + "</small>" : "") + "</div>"; }).join("");
  return '<div class="tk' + (late ? " late" : "") + '"><div class="h"><b>' + o.number + "</b><span>" + mins(o) + " min</span></div><div class=\"m\">" + (o.mode === "go" ? "Mitnahme" : "Im Laden") + " · Ziel ca. " + Math.ceil(o.mins[s] || 0.5) + " min</div>" + lines +
    '<button data-k="st" data-s="' + s + '" data-id="' + o.id + '">Fertig</button></div>';
}
function sideTk(o, btn){ return '<div class="tk"><div class="h"><b>' + o.number + "</b><span>" + eur(o.total) + '</span></div><div class="m">' + (o.pay.method === "cash" ? "Bar, Zahlung offen" : (o.mode === "go" ? "Mitnahme" : "Im Laden")) + "</div>" + '<button data-k="' + btn[0] + '" data-id="' + o.id + '">' + btn[1] + "</button></div>"; }
function renderKds(){
  var all = db(), open = all.filter(function(o){ return o.status === "open"; }), sold = soldList(), q = queue();
  var cols = Object.keys(SNAME).map(function(s){ var os = open.filter(function(o){ return o.st[s] === "open"; });
    return '<div class="k-col"><h2><span>' + SNAME[s][0] + "</span><span>" + os.length + '</span></h2><div class="sub">' + SNAME[s][1] + " · Stau ca. " + Math.ceil(q[s]) + ' min</div><div class="list">' + os.map(function(o){ return ticket(o, s); }).join("") + "</div></div>"; }).join("");
  var pay = all.filter(function(o){ return o.status === "awaiting_payment"; }), rdy = all.filter(function(o){ return o.status === "ready"; });
  var side = '<div class="k-side"><div class="k-col"><h2><span>zahlung offen</span><span>' + pay.length + '</span></h2><div class="list">' + pay.map(function(o){ return sideTk(o, ["paid", "Bezahlt"]); }).join("") + '</div></div><div class="k-col"><h2><span>bereit</span><span>' + rdy.length + '</span></h2><div class="sub">Am Pickup Würfel</div><div class="list">' + rdy.map(function(o){ return sideTk(o, ["pick", "Abgeholt"]); }).join("") + "</div></div></div>";
  var drawer = K_OPEN ? '<div class="k-draw"><h3>ausverkauft schalten</h3>' + M.items.filter(function(i){ return !i.kombi; }).map(function(i){ var s = sold.indexOf(i.id) > -1; return '<div class="it"><span>' + esc(i.nr + " " + i.name) + '</span><button class="' + (s ? "on" : "") + '" data-sold="' + i.id + '">' + (s ? "Ausverkauft" : "Verfügbar") + "</button></div>"; }).join("") + "</div>" : "";
  app.innerHTML = '<div class="k-wrap"><div class="k-top">' + logo() + '<h1>küche</h1><span class="q">Bon je Station · alles frisch</span><button class="k-btn" data-demo="1">Beispielbestellung</button><button class="k-btn' + (K_OPEN ? " on" : "") + '" data-drawer="1">Ausverkauft (' + sold.length + ")</button></div><div class=\"k-cols\">" + cols + side + "</div>" + drawer + "</div>";
}
/* ---------------- Abholmonitor ---------------- */
function renderReady(){
  var all = db(), f = all.filter(function(o){ return o.status === "ready"; }), p = all.filter(function(o){ return o.status === "open"; });
  var rest = function(o){ var r = o.eta - (Date.now() - new Date(o.started || o.created).getTime()) / 60000; return r <= 0.5 ? "gleich" : "ca. " + Math.ceil(r) + " min"; };
  app.innerHTML = '<div class="r-wrap"><section class="r-a"><div class="k">[ BEREIT ]</div><h1>abholen</h1><div class="nums">' + (f.length ? f.map(function(o){ return "<span>" + o.number + "</span>"; }).join("") : '<div class="empty">Gerade ist nichts fertig. Wir mixen und toasten alles frisch.</div>') + "</div></section>" +
    '<section class="r-b"><div class="glow"></div><div class="cube"><div class="f1"><svg viewBox="' + M.vb.mark + '"><use href="#mark"/></svg></div><div class="f2"></div><div class="f3"></div></div><div class="t">pickup würfel</div><div class="s">Wenn deine Nummer links steht, wartet dein Becher hier.</div>' + logo() + "</section>" +
    '<section class="r-c"><div class="k">[ IN ARBEIT ]</div><h1>frisch</h1><div class="nums">' + (p.length ? p.map(function(o){ return "<div><b>" + o.number + "</b><span>" + rest(o) + "</span></div>"; }).join("") : '<div class="empty">Keine offenen Bestellungen.</div>') + "</div></section>" +
    '<div class="r-foot">' + esc(M.foot) + "</div></div>";
}
if(VIEW !== "kiosk"){
  app.addEventListener("click", function(e){
    var b = e.target.closest("button"); if(!b) return;
    if(b.dataset.k === "st") stationDone(b.dataset.id, b.dataset.s);
    else if(b.dataset.k === "paid") paid(b.dataset.id);
    else if(b.dataset.k === "pick") pickedUp(b.dataset.id);
    else if(b.dataset.drawer) K_OPEN = !K_OPEN;
    else if(b.dataset.demo) demoOrder();
    else if(b.dataset.sold){ var s = soldList(), i = s.indexOf(b.dataset.sold); if(i > -1) s.splice(i, 1); else s.push(b.dataset.sold); setSold(s); }
    render();
  });
  if(bc) bc.onmessage = function(){ render(); };
  addEventListener("storage", render); setInterval(render, VIEW === "kds" ? 5000 : 10000);
} else if(bc) bc.onmessage = function(m){ if(m.data === "sold" || S.screen === "attract") render(); };
render();
})();

</script>
</body>
